<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src none" />
  <title>NSR HUB</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- شريط العنوان المخصص -->
  <header id="titlebar">
    <div id="titlebar-brand">
      <img id="titlebar-logo" src="logo.png" alt="" />
      <span>NSR <b>HUB</b></span>
      <span id="titlebar-version" class="tb-version"></span>
    </div>
    <div id="titlebar-controls">
      <button class="tb-btn" id="tb-min" title="تصغير">&#x2500;</button>
      <button class="tb-btn" id="tb-max" title="تكبير">&#x25A1;</button>
      <button class="tb-btn tb-close" id="tb-close" title="إغلاق">&#x2715;</button>
    </div>
  </header>

  <!-- شاشة الإعدادات/تسجيل الدخول -->
  <section id="screen-login" class="screen active">
    <div class="login-card">
      <img id="login-logo" class="login-logo" src="logo.png" alt="logo" />
      <h1 class="brand">NSR <span>HUB</span></h1>

      <div class="field-row">
        <button id="btn-login" class="btn primary big">تسجيل الدخول عبر Discord</button>
      </div>
      <p id="login-error" class="error"></p>
    </div>
  </section>

  <!-- شاشة السيرفرات -->
  <section id="screen-servers" class="screen">
    <header class="topbar">
      <div class="user-chip">
        <button id="btn-user-menu" class="chip-btn">
          <img id="user-avatar" class="avatar" alt="avatar" />
          <span id="user-name">—</span>
          <span id="customer-badge" class="customer-badge hidden"><img src="logo.png" alt="" />كوستمر</span>
        </button>
        <div id="user-menu" class="user-menu hidden">
          <div class="um-head">
            <img id="um-avatar" class="avatar" alt="" />
            <div class="um-info">
              <b id="um-name">—</b>
              <small id="um-id"></small>
            </div>
          </div>
          <div class="um-row">عدد سيرفراتك الإدارية والمملوكة: <b id="um-count">0</b></div>
          <button id="btn-logout" class="um-logout">تسجيل خروج</button>
        </div>
      </div>
      <div class="bridge-group">
        <div class="bridge-status">
          <span id="bridge-dot" class="dot off"></span>
          <span id="bridge-text">الجسر غير متصل</span>
        </div>
        <button id="btn-discord-server" class="discord-btn" title="سيرفر NSR HUB">
          <svg viewBox="0 0 127.14 96.36" width="20" height="20"><path fill="currentColor" d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
        </button>
      </div>
    </header>

    <div class="servers-toolbar">
      <h2 class="page-title">اختر سيرفرك لإدارة اللوحة <span class="divider"></span></h2>
      <div id="btn-owner-wrap" class="owner-wrap hidden">
        <button id="btn-owner-view" class="owner-view-btn" title="قائمة المالك">
          <img src="logo.png" alt="قائمة المالك" />
        </button>
        <div id="owner-menu" class="owner-menu hidden">
          <button data-owner-opt="subs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>الاشتراكات</button>
          <button data-owner-opt="all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01"/><path d="M6 18h.01"/></svg>كل السيرفرات</button>
        </div>
      </div>
    </div>
    <div class="search-wrap hidden" id="servers-search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="servers-search" type="text" placeholder="ابحث في السيرفرات..." />
    </div>
    <div id="servers-grid" class="servers-grid"></div>
    <p id="servers-empty" class="empty hidden">لا توجد سيرفرات تملك فيها صلاحية أدمن مع وجود البوت فيها.</p>
  </section>

  <!-- شاشة الاشتراكات (المالك) -->
  <section id="screen-subs" class="screen">
    <header class="topbar">
      <button id="btn-subs-back" class="btn ghost back-btn">
        <img id="subs-back-logo" src="logo.png" alt="" />
        السيرفرات
      </button>
      <div class="guild-chip">
        <span>الاشتراكات والرتب</span>
      </div>
      <div class="bridge-status">
        <span id="bridge-dot3" class="dot off"></span>
        <span id="bridge-text3">الجسر غير متصل</span>
      </div>
    </header>
    <main id="subs-main" class="subs-main"></main>
  </section>

  <!-- شاشة اللوحة -->
  <section id="screen-dashboard" class="screen">
    <header class="topbar">
      <button id="btn-back" class="btn ghost back-btn">
        <img id="back-logo" src="logo.png" alt="" />
        السيرفرات
      </button>
      <div class="guild-chip">
        <img id="guild-icon" class="avatar" alt="guild" />
        <span id="guild-name">—</span>
      </div>
      <div class="bridge-status">
        <span id="bridge-dot2" class="dot off"></span>
        <span id="bridge-text2">الجسر غير متصل</span>
      </div>
    </header>

    <nav id="dash-nav" class="dash-nav">
      <button data-page="home" class="nav-btn active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>الرئيسية</button>
      <button data-page="welcome" class="nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>الترحيب</button>
      <button data-page="tickets" class="nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg>التذاكر</button>
      <button data-page="suggestions" class="nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2Z"/></svg>الاقتراحات</button>
      <button data-page="ai" class="nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44A2.5 2.5 0 0 1 4 17.5v-3a2.5 2.5 0 0 1-.5-4.92A2.5 2.5 0 0 1 5 5.5h3.5A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44A2.5 2.5 0 0 0 20 17.5v-3a2.5 2.5 0 0 0 .5-4.92A2.5 2.5 0 0 0 19 5.5h-3.5A2.5 2.5 0 0 0 14.5 2Z"/></svg>معالج AI</button>
      <button data-page="ratings" class="nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>المتجر</button>
      <button data-page="logs" class="nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>اللوقات</button>
      <button data-page="security" class="nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>الأمان</button>
      <button data-page="messages" class="nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-9 8.35 8.5 8.5 0 0 1-3.1-.59L3 21l1.74-5.9A8.5 8.5 0 0 1 3 11.5 8.38 8.38 0 0 1 12 3a8.38 8.38 0 0 1 9 8.5Z"/><path d="M8 11h.01"/><path d="M12 11h.01"/><path d="M16 11h.01"/></svg>الرسائل</button>
      <button data-page="send" class="nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>إرسال اللوحات</button>
      <button data-page="auth" class="nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>الصلاحيات</button>
      <button data-page="brand" class="nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.5-.6 1.5-1.4 0-.35-.13-.66-.35-.9a1.4 1.4 0 0 1-.9-1.3c0-.8.65-1.4 1.45-1.4H17c3.3 0 5-2.2 5-4.8C22 6 17.5 2 12 2Z"/></svg>المظهر</button>
    </nav>

    <main id="dash-main" class="dash-main"></main>
  </section>

  <!-- شريط إشعارات -->
  <div id="toast" class="toast"></div>

  <!-- شاشة التحديث الإجباري -->
  <div id="update-overlay" class="update-overlay">
    <div class="update-card">
      <div class="update-spinner"></div>
      <h2 id="update-title">جاري التحقق من التحديثات...</h2>
      <p id="update-sub" class="update-sub"></p>
      <div id="update-bar-wrap" class="update-bar-wrap hidden">
        <div id="update-bar" class="update-bar"></div>
      </div>
      <button id="btn-update-download" class="btn primary hidden" style="margin-top:20px;">تحميل التحديث الآن</button>
      <button id="btn-update-manual" class="btn hidden" style="margin-top:10px;">تحميل يدوي</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
