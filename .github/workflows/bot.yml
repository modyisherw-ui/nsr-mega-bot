name: Run Bot 24/7

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # كل نص ساعة: أي فجوة بين الجلسات ما تتجاوز وقت الإقلاع (~دقيقة)
    - cron: "*/30 * * * *"

# مجموعة توازٍ واحدة: تشغيل واحد فقط + انتظار واحد (الأحدث يلغي الأقدم)
# الإلغاء يصير عند push يدوياً فقط — التشغيل المجدول ما يقطع جلسة شغالة
# (وبالمقابل دفعات sync تحمل [skip ci] فلا تسبب إعادة تشغيل بلا نهاية)
# ⚠️ لا تكتب علامة التخطي داخل رسالة كوميت عادي: يحجب GitHub أحداث push لهذا
#    الكوميت كله (يظهر الكوميت كأنه صامت في Actions). المقصود بها دفعة sync وحدها.
concurrency:
  group: bot-run
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    # أقل من حد GitHub (6 ساعات): الجلسة تنتهي ويعيد الجدولة تشغيل واحدة جديدة فوراً
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci --omit=dev --omit=optional

      - name: Write .env
        run: |
          touch .env
          echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}" >> .env
          echo "CLIENT_ID=${{ secrets.CLIENT_ID }}" >> .env
          echo "GUILD_ID=${{ secrets.GUILD_ID }}" >> .env

      - name: Pull latest data
        run: |
          git pull origin main --no-edit || true

      - name: Run bot with keep-alive
        run: |
          set -e
          # مفتاح الإيقاف: لو فيه ملف data/stop البوت لا يشتغل نهائياً
          # لتشغيله من جديد: احذف الملف وادفع أو run workflow يدوياً
          if [ -f data/stop ]; then
            echo "STOPPED: data/stop exists. Bot will not run. Delete the file to start it again."
            exit 0
          fi
          git config user.name "nsr-bot"
          git config user.email "nsr-bot@users.noreply.github.com"

          # سجل حي لكل جلسة: نبدأ من ملف فارغ حتى لا يكبر الريبو بلا حدود
          : > data/bot-live.txt || true

          # [skip ci] ضروري: بدونها كل دفعة sync تلغي الجلسة الحالية وتعيد تشغيل البوت بلا نهاية
          # pull --rebase: لو سبقنا رِبو آخر (سباق عند الإلغاء) نعيد تطبيق كوميتاتنا فوقه بدل أن تفشل المزامنة للأبد
          # checkpoint: نفرّغ الـ WAL داخل bot.db قبل المزامنة حتى تكون النسخة المحفوظة كاملة ومتسقة
          ( while true; do sleep 120; if [ -f data/bot.db ]; then node -e "const{DatabaseSync}=require('node:sqlite');const d=new DatabaseSync('data/bot.db');d.exec('PRAGMA wal_checkpoint(TRUNCATE)');d.close()" || true; fi; git add -A data config.json; if ! git diff --cached --quiet; then git commit -m "chore: sync db $(date -u +%H:%M) [skip ci]" || true; git pull --rebase origin main || git rebase --abort || true; git push origin main || true; fi; done ) &
          WATCHER=$!

          while true; do
            if [ -f data/stop ]; then
              echo "STOPPED: data/stop appeared, shutting down."
              kill $WATCHER 2>/dev/null || true
              exit 0
            fi
            node src/index.js || true
            echo "[keep-alive] bot exited, restarting in 20s..."
            sleep 20
          done