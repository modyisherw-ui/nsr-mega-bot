name: Run Bot 24/7

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: bot-run
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci --omit=dev --omit=optional

      - name: Write .env
        run: |
          touch .env
          echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}" >> .env
          echo "CLIENT_ID=${{ secrets.CLIENT_ID }}" >> .env
          echo "GUILD_ID=${{ secrets.GUILD_ID }}" >> .env

      - name: Pull latest data
        run: |
          git pull origin main --no-edit || true

      - name: Run bot with keep-alive
        run: |
          set -e
          git config user.name "nsr-bot"
          git config user.email "nsr-bot@users.noreply.github.com"

          # Ø­Ø§Ø±Ø³: ÙƒÙ„ 2 Ø¯Ù‚ÙŠÙ‚Ø© Ù†Ø´Ø§Ø±Ùƒ Ù‚Ø§Ø¹Ø¯Ø© Ø§Ù„Ø¨ÙŠØ§Ù†Ø§Øª ÙÙŠ Ø§Ù„Ø±ÙŠØ¨Ùˆ Ø¹Ø´Ø§Ù† Ù…Ø§ ØªØ¶ÙŠØ¹
          (
            while true; do
              sleep 120
              git add -A data config.json
              if ! git diff --cached --quiet; then
                git commit -m "chore: sync db $(date -u +%H:%M)" || true
                git push origin main || true
              fi
            done
          ) &
          WATCHER=$!

          # Ø­Ù„Ù‚Ø© Ø¥Ø¹Ø§Ø¯Ø© ØªØ´ØºÙŠÙ„: Ù„Ùˆ Ø·ÙÙ‰ Ø§Ù„Ø¨ÙˆØª Ù†Ø±Ø¬Ø¹ Ù†Ø´ØºÙ„Ù‡
          while true; do
            node src/index.js || true
            echo "[keep-alive] bot exited, restarting in 20s..."
            sleep 20
          done

          kill $WATCHER 2>/dev/null || true
