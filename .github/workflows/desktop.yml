name: Build Desktop App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install deps
        working-directory: desktop
        run: npm ci

      - name: Enable developer mode (symlinks for winCodeSign)
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f

      - name: Build installer
        working-directory: desktop
        run: |
          npm run dist *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print build log on failure
        if: failure()
        working-directory: desktop
        run: |
          Get-Content build.log -Tail 80
          Get-ChildItem dist -ErrorAction SilentlyContinue | Select-Object Name, Length

      - name: Upload to GitHub Releases
        if: success()
        working-directory: desktop
        run: |
          gh release create desktop --title "NSR Dashboard" --notes "لوحة تحكم سطح المكتب للبوت — أحدث إصدار" --latest=false || true
          gh release upload desktop dist/NSR-Dashboard-Setup-*.exe --clobber

      - name: Show artifacts
        working-directory: desktop
        run: Get-ChildItem dist | Select-Object Name, Length