name: Build Desktop App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install deps
        working-directory: desktop
        run: npm ci

      - name: Enable developer mode (symlinks for winCodeSign)
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f

      - name: Build installer
        working-directory: desktop
        run: |
          npm run dist *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print build log on failure
        if: failure()
        working-directory: desktop
        run: |
          Get-Content build.log -Tail 80
          Copy-Item build.log build-error.log -Force
          git config user.name "nsr-bot"
          git config user.email "nsr-bot@users.noreply.github.com"
          for ($i = 0; $i -lt 6; $i++) {
            git pull --rebase origin main --no-edit 2>$null | Out-Null
            git add -f build-error.log
            git commit -m "debug: desktop build error log" 2>$null | Out-Null
            git push origin main 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 15
          }
          Get-Content build-error.log -Tail 5

      - name: Upload to GitHub Releases
        if: success()
        working-directory: desktop
        run: |
          $log = "upload.log"
          "--- release create/update ---" | Out-File $log
          $repo = "modyisherw-ui/nsr-mega-bot"
          $tag = "desktop"
          # إنشاء أو تحديث الـ release بوسم ثابت
          $body = @{ tag_name = $tag; name = "NSR Dashboard"; body = "لوحة تحكم سطح المكتب للبوت — أحدث إصدار"; draft = $false; prerelease = $false } | ConvertTo-Json
          try {
            $h = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json"; "User-Agent" = "ps" }
            $rel = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$repo/releases" -Headers $h -Body $body -ContentType "application/json" -ErrorAction Stop
            "release created: $($rel.id)" | Out-File -Append $log
          } catch {
            $r = $_.Exception.Message
            "create failed: $r (probably exists)" | Out-File -Append $log
            $rels = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$repo/releases?per_page=100" -Headers $h
            $rel = $rels | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
            if ($rel) {
              "found existing release: $($rel.id)" | Out-File -Append $log
              $patch = @{ body = "لوحة تحكم سطح المكتب للبوت — أحدث إصدار" } | ConvertTo-Json
              Invoke-RestMethod -Method Patch -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)" -Headers $h -Body $patch -ContentType "application/json" | Out-Null
            } else {
              "NO RELEASE AVAILABLE" | Out-File -Append $log
              exit 1
            }
          }
          # رفع الملف
          $exe = Get-ChildItem dist/NSR-Dashboard-Setup-*.exe | Select-Object -First 1
          if (-not $exe) { "NO EXE FOUND in dist" | Out-File -Append $log; exit 1 }
          "uploading $($exe.Name) ($($exe.Length) bytes)" | Out-File -Append $log
          $fileBytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          try {
            $up = Invoke-RestMethod -Method Post -Uri "https://uploads.github.com/repos/$repo/releases/$($rel.id)/assets?name=$($exe.Name)" -Headers ( @{ Authorization = "Bearer $env:GITHUB_TOKEN"; "User-Agent" = "ps" } ) -ContentType "application/octet-stream" -Body $fileBytes -ErrorAction Stop
            "asset uploaded: $($up.name) state=$($up.state)" | Out-File -Append $log
          } catch {
            "upload failed: $($_.Exception.Message)" | Out-File -Append $log
            exit 1
          }
          Get-Content $log

      - name: Show artifacts
        if: always()
        working-directory: desktop
        run: Get-ChildItem dist | Select-Object Name, Length