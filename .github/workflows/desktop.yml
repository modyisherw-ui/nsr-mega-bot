name: Build Desktop App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install deps
        working-directory: desktop
        run: npm ci

      - name: Enable developer mode (symlinks for winCodeSign)
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f

      - name: Build installer
        working-directory: desktop
        run: |
          npm run dist *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print build log on failure
        if: failure()
        working-directory: desktop
        run: |
          Get-Content build.log -Tail 80
          Copy-Item build.log build-error.log -Force
          git config user.name "nsr-bot"
          git config user.email "nsr-bot@users.noreply.github.com"
          for ($i = 0; $i -lt 6; $i++) {
            git pull --rebase origin main --no-edit 2>$null | Out-Null
            git add -f build-error.log
            git commit -m "debug: desktop build error log" 2>$null | Out-Null
            git push origin main 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 15
          }
          Get-Content build-error.log -Tail 5

      - name: Upload to GitHub Releases
        if: success()
        working-directory: desktop
        run: |
          $ErrorActionPreference = "Continue"
          $log = "upload.log"
          $repo = "modyisherw-ui/nsr-mega-bot"
          $tag = "desktop"
          $h = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json"; "User-Agent" = "ps" }
          "token len: $($env:GITHUB_TOKEN.Length)" | Out-File $log

          $rel = $null
          $rels = @()
          # جرّب إنشاء الـ release
          try {
            $body = @{ tag_name = $tag; name = "NSR Dashboard"; body = "لوحة تحكم سطح المكتب للبوت"; draft = $false; prerelease = $false } | ConvertTo-Json
            $rel = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$repo/releases" -Headers $h -Body $body -ContentType "application/json"
            "release created: $($rel.id)" | Out-File -Append $log
          } catch {
            "create failed: $($_.Exception.Message)" | Out-File -Append $log
          }
          if (-not $rel) {
            try {
              $rels = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$repo/releases?per_page=100" -Headers $h
              $rel = @($rels) | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
            } catch { "list failed: $($_.Exception.Message)" | Out-File -Append $log }
            if ($rel) { "found existing release: $($rel.id)" | Out-File -Append $log }
            else { "NO RELEASE AVAILABLE" | Out-File -Append $log }
          }

          if ($rel) {
            $exe = Get-ChildItem dist/NSR-Dashboard-Setup-*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($exe) {
              "uploading $($exe.Name) ($($exe.Length) bytes)" | Out-File -Append $log
              try {
                $fileBytes = [System.IO.File]::ReadAllBytes($exe.FullName)
                $up = Invoke-RestMethod -Method Post -Uri "https://uploads.github.com/repos/$repo/releases/$($rel.id)/assets?name=$($exe.Name)" -Headers ( @{ Authorization = "Bearer $env:GITHUB_TOKEN"; "User-Agent" = "ps" } ) -ContentType "application/octet-stream" -Body $fileBytes
                "asset uploaded: $($up.name) state=$($up.state)" | Out-File -Append $log
              } catch {
                "asset upload failed: $($_.Exception.Message)" | Out-File -Append $log
              }
            } else { "NO EXE FOUND in dist" | Out-File -Append $log }
          }

          Get-Content $log
          # تحميل السجل إلى الريبو لمراجعته دائماً
          git config user.name "nsr-bot" 2>$null | Out-Null
          git config user.email "nsr-bot@users.noreply.github.com" 2>$null | Out-Null
          git add -f upload.log 2>$null | Out-Null
          git commit -m "debug: upload log" 2>$null | Out-Null
          git pull --rebase origin main --no-edit 2>$null | Out-Null
          git push origin main 2>$null | Out-Null

      - name: Show artifacts
        if: always()
        working-directory: desktop
        run: Get-ChildItem dist | Select-Object Name, Length